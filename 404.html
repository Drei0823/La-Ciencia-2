<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Logout Tracker</title>
  <script>
    // GitHub Pages SPA fallback — redirect unknown paths to index.html
    (function () {
      var path = window.location.pathname;
      var base = path.endsWith('/') ? path : path.replace(/\/[^/]*$/, '/');
      window.location.replace(base + 'index.html' + window.location.search + window.location.hash);
    })();
  </script>
</head>
<body></body>
</html>
