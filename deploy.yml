name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Supabase config from secrets
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ] && [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            cat > js/config.js << EOF
          /**
           * Auto-generated by GitHub Actions — do not edit manually
           */
          window.APP_CONFIG = {
            supabaseUrl: '${{ secrets.SUPABASE_URL }}',
            supabaseAnonKey: '${{ secrets.SUPABASE_ANON_KEY }}',
          };

          window.isAppConfigured = function () {
            return (
              window.APP_CONFIG.supabaseUrl !== 'YOUR_SUPABASE_URL' &&
              window.APP_CONFIG.supabaseAnonKey !== 'YOUR_SUPABASE_ANON_KEY' &&
              window.APP_CONFIG.supabaseUrl.startsWith('https://') &&
              window.APP_CONFIG.supabaseAnonKey.length > 20
            );
          };
          EOF
            echo "Config injected from GitHub secrets."
          else
            echo "::warning::SUPABASE_URL and SUPABASE_ANON_KEY secrets not set."
            echo "Either add secrets in Settings → Secrets → Actions,"
            echo "or edit js/config.js directly before pushing."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
